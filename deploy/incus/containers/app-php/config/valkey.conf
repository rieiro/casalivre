# CasaLivre Valkey - Unix socket only (no TCP), ACL users in valkey.acl.
# The socket directory is recreated by the runit run script on every start.
port 0
unixsocket /run/casalivre-valkey/valkey.sock
unixsocketperm 660
daemonize no
dir /var/lib/casalivre/media/valkey
aclfile /etc/casalivre-valkey/valkey.acl
logfile ""
