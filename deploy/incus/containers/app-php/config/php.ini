; CasaLivre PHP-FPM production configuration (managed by deploy/incus).
[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php-fpm/error.log
error_reporting = E_ALL & ~E_DEPRECATED
memory_limit = 256M
max_execution_time = 30
max_input_time = 60
post_max_size = 128M
upload_max_filesize = 16M
max_file_uploads = 40
default_charset = "UTF-8"
date.timezone = UTC
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,pcntl_signal,dl
open_basedir = /srv/app:/var/lib/casalivre:/var/lib/php/sessions:/tmp
sys_temp_dir = /tmp
upload_tmp_dir = /tmp

[Session]
session.save_handler = files
session.save_path = "/var/lib/php/sessions"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 3600
session.sid_length = 48
session.sid_bits_per_character = 6

[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1
