# CasaLivre PostgreSQL host-based authentication (managed by deploy/incus).
# Local administrators use peer auth; the application uses TLS + SCRAM.
#
# TYPE      DATABASE        USER            ADDRESS                 METHOD
local       all             postgres                                peer
local       replication     postgres                                peer
local       all             all                                     peer
hostssl     all             casalivre_app   10.10.20.11/32          scram-sha-256
hostssl     all             cl_logw         10.10.20.11/32          scram-sha-256
hostssl     all             cl_retention_job 10.10.20.11/32         scram-sha-256
hostnossl   all             all             all                     reject
