# CasaLivre PostgreSQL (managed by deploy/incus, Void Linux package layout).
listen_addresses = '10.10.20.10'
port = 5432
max_connections = 100
unix_socket_directories = '/run/postgresql'

# Memory (container limit: 1 GiB)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 16MB
temp_buffers = 8MB

# WAL / durability
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
synchronous_commit = on
full_page_writes = on
fsync = on

# Planner
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Passwords: SCRAM only.
password_encryption = 'scram-sha-256'

# TLS: server certificate generated on the host and pushed into PGDATA.
ssl = on
ssl_cert_file = '/var/lib/postgresql/data/server.crt'
ssl_key_file = '/var/lib/postgresql/data/server.key'
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on
ssl_ciphers = 'HIGH:!aNULL:!eNULL'

# Logging: runit captures stderr.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# Timezone / locale
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# Extensions
shared_preload_libraries = 'pg_stat_statements'
