name: acl-internal
description: Air-gapped internal network - only app-php (10.10.20.11) may reach db-pg (10.10.20.10:5432)
config:
  user.casalivre.role: internal
ingress:
  # TCP 5432 strictly from app-php to db-pg.
  - action: allow
    state: enabled
    protocol: tcp
    source: "10.10.20.11/32"
    destination: "10.10.20.10/32"
    destination_port: "5432"
  - action: drop
    state: enabled
egress:
  # Only the database reply leaves db-pg.
  - action: allow
    state: enabled
    protocol: tcp
    source: "10.10.20.10/32"
    destination: "10.10.20.11/32"
    source_port: "5432"
  - action: drop
    state: enabled
