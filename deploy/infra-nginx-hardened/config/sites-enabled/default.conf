# HTTP listener on 8080 (host DNAT maps external :80 here).
# Serves ACME HTTP-01 challenges and a health probe, then redirects to HTTPS.
server {
    listen 8080 default_server;
    server_name __PRIMARY_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        access_log off;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# HTTPS reverse proxy on 8443 (host DNAT maps external :443 here).
server {
    listen 8443 ssl;
    http2 on;
    server_name __PRIMARY_DOMAIN__;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;

    include /usr/local/nginx/conf/snippets/ssl-params.conf;
    include /usr/local/nginx/conf/snippets/headers.conf;

    limit_req  zone=req_per_ip  burst=40 nodelay;
    limit_conn conn_per_ip 40;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Stricter bucket for authentication/account flows.
    location ~ ^/(entrar|sair|conta|senha|api/sessao|api/users|api/auth)/? {
        limit_req zone=req_strict burst=10 nodelay;

        proxy_pass http://__BACKEND_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location / {
        limit_req zone=req_per_ip burst=40 nodelay;

        proxy_pass http://__BACKEND_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_redirect off;
    }
}
