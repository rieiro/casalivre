# HTTP listener on 8080 (host DNAT maps external :80 here).
# Serves ACME HTTP-01 challenges and a health probe, then redirects to HTTPS.
server {
    listen 8080 default_server;
    server_name __PRIMARY_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        access_log off;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# HTTPS FastCGI front controller on 8443 (host DNAT maps external :443 here).
server {
    listen 8443 ssl;
    http2 on;
    server_name __PRIMARY_DOMAIN__;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;

    include /usr/local/nginx/conf/snippets/ssl-params.conf;
    include /usr/local/nginx/conf/snippets/headers.conf;

    root /srv/app/public;
    index index.php;

    limit_req  zone=req_per_ip  burst=40 nodelay;
    limit_conn conn_per_ip 40;

    # Block every dotfile (keep ACME/.well-known reachable).
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Static assets are served by the edge from the shared /srv/static volume.
    location /assets/ {
        root /srv/static;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location /uploads/ {
        root /srv/static;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Single front controller: any non-file request goes to public/index.php.
    location / {
        limit_req zone=req_per_ip burst=40 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    # Stricter bucket for authentication/account flows (still the same front controller).
    location ~ ^/(entrar|sair|conta|senha|api/sessao|api/users|api/auth)/? {
        limit_req zone=req_strict burst=10 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    # Only /index.php may reach PHP-FPM, and only via the internal redirect above.
    location ~ ^/index\.php(/|$) {
        internal;
        include fastcgi_params;
        fastcgi_pass 10.10.10.20:9000;
        fastcgi_param SCRIPT_FILENAME /srv/app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/app/public;

        # Content negotiation: the app serves Markdown when the client sends Accept: text/markdown.
        fastcgi_param HTTP_ACCEPT $http_accept;
        fastcgi_param HTTP_USER_AGENT $http_user_agent;

        # Trusted edge: set the forwarding headers instead of trusting client values.
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 16k;
    }

    # Any other .php path is never executed.
    location ~ \.php$ { return 404; }

    # AI search/agent user agents are explicitly allowed (there is no UA blocking here):
    # OAI-SearchBot, ClaudeBot, Google-Extended, PerplexityBot.
    # The Accept and User-Agent headers are forwarded to PHP-FPM so the app can negotiate content.
}
