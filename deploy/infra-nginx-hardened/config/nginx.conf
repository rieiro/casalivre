# CasaLivre hardened nginx edge - managed by deploy/infra-nginx-hardened.
# The master process runs as the unprivileged user "nginx" on ports 8080/8443; the host
# maps 80/443 to those ports with nftables DNAT (host/nftables-nginx.conf).

worker_processes auto;
worker_rlimit_nofile 8192;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    client_body_temp_path /var/cache/nginx/client_body;
    proxy_temp_path /var/cache/nginx/proxy;
    fastcgi_temp_path /var/cache/nginx/fastcgi;

    # The application accepts up to 128 MB per submission (multiple photos).
    client_max_body_size 128m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 32k;
    proxy_max_temp_file_size 0;

    # Rate-limit zones are defined once, here (limit_req_zone is an http-level directive).
    include /usr/local/nginx/conf/snippets/rate-limit.conf;

    include /usr/local/nginx/conf/sites-enabled/*.conf;
}
