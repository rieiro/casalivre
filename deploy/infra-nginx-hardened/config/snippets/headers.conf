# Security headers for every proxied response.
# The CSP mirrors the application's own policy (src/helpers/url.php), so if the upstream also sends
# Content-Security-Policy the intersection is the same policy.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'none'; img-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

# headers-more-nginx-module: remove version/fingerprint headers the upstream may send.
more_clear_headers Server;
more_clear_headers X-Powered-By;
