# Per-IP request and connection limits. Zones are defined once, at http level; they are
# referenced by limit_req/limit_conn in the server and location blocks.
limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Stricter bucket for authentication and account endpoints.
limit_req_zone  $binary_remote_addr zone=req_strict:10m rate=5r/s;
