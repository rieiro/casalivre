#!/usr/sbin/nft -f
# Host DNAT for the CasaLivre nginx edge.
#
# This file is a template: scripts/03-cutover.sh and scripts/04-rollback.sh render
# __ACTIVE_NGINX_IP__ / __PUBLIC_IFACE__ and apply the result with `nft -f -` in a single
# atomic transaction.
#
#   external :80  -> active nginx :8080
#   external :443 -> active nginx :8443
#
# nginx listens on unprivileged ports as the "nginx" user; the host performs the privileged mapping.
# Lateral movement is enforced by the Incus DMZ ACL (incus/acl-dmz.yaml), not by a global forward drop
# (a global drop here would break every other Incus network on the host).

table inet casalivre_edge {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iifname "__PUBLIC_IFACE__" tcp dport 80 dnat ip to __ACTIVE_NGINX_IP__:8080
        iifname "__PUBLIC_IFACE__" tcp dport 443 dnat ip to __ACTIVE_NGINX_IP__:8443
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        ct state established,related accept
        ip daddr __ACTIVE_NGINX_IP__ tcp dport { 8080, 8443 } ct state new accept
    }
}
